<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>户型 3D 复原 · 大床房公寓 33.6㎡</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 15 16 5l12 10v12H20v-7h-8v7H4z' fill='none' stroke='%232f5d5b' stroke-width='2.2' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --ink:#26332f; --sub:#6a7772; --line:#e3e1da; --teal:#2f5d5b; --teal-d:#244947;
  --accent:#d08b4e; --bg:#ccd4d0; --card:rgba(255,255,255,.93); --shadow:0 10px 34px rgba(38,51,47,.18);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB","Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}
#stage{position:fixed;inset:0}
#stage canvas{display:block}

/* ---------- 加载 ---------- */
#loader{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:18px;background:linear-gradient(160deg,#f6f4ee,#e9ece8);transition:opacity .6s ease}
#loader.hide{opacity:0;pointer-events:none}
.lr-logo{width:54px;height:54px}
.lr-title{font-size:17px;font-weight:700;letter-spacing:1px}
.lr-sub{font-size:12px;color:var(--sub)}
.lr-bar{width:170px;height:3px;border-radius:3px;background:#dfe2dd;overflow:hidden}
.lr-bar i{display:block;height:100%;width:38%;background:var(--teal);border-radius:3px;animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{margin-left:-40%}100%{margin-left:110%}}

/* ---------- HUD 通用 ---------- */
.hud{position:fixed;z-index:20;pointer-events:none}
.panel{background:var(--card);border:1px solid rgba(227,225,218,.9);border-radius:14px;box-shadow:var(--shadow);
  backdrop-filter:blur(10px);pointer-events:auto}
.pad{padding:14px 16px}
.tl{top:16px;left:16px;max-width:262px;max-height:calc(100vh - 300px);overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:30px;height:30px;flex:none}
.brand h1{font-size:15.5px;font-weight:800;letter-spacing:.5px;line-height:1.25}
.brand small{display:block;font-size:11px;color:var(--sub);font-weight:500;margin-top:2px}
.meta{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
.chip{font-size:11px;color:var(--teal-d);background:#eaf1ef;border:1px solid #d8e4e1;border-radius:20px;padding:3px 10px;font-weight:600}
.divider{height:1px;background:var(--line);margin:12px 0}
.ctl-label{font-size:11px;color:var(--sub);font-weight:700;margin:10px 0 7px;letter-spacing:1px}
.ctl-label:first-child{margin-top:2px}
.seg{display:flex;background:#eef0ec;border-radius:9px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--sub);
  padding:7px 4px;border-radius:7px;cursor:pointer;transition:.18s}
.seg button.on{background:#fff;color:var(--teal-d);box-shadow:0 2px 7px rgba(38,51,47,.12)}
.toggles{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.tg{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink);background:#f4f3ee;border:1px solid var(--line);
  border-radius:9px;padding:8px 9px;cursor:pointer;user-select:none;transition:.16s;grid-column:span 1}
.tg.wide{grid-column:span 2}
.tg.on{background:#eaf1ef;border-color:#c9dcd8;color:var(--teal-d);font-weight:700}
.tg .dot{width:15px;height:15px;border-radius:50%;border:2px solid #c2c8c3;flex:none;position:relative;transition:.16s}
.tg.on .dot{border-color:var(--teal);background:var(--teal)}
.tg.on .dot::after{content:"";position:absolute;left:3.5px;top:3.5px;width:6px;height:6px;border-radius:50%;background:#fff}
.btnrow{display:flex;gap:8px}
.btn{flex:1;border:1px solid var(--line);background:#fbfaf6;font-family:inherit;font-size:12px;font-weight:600;color:var(--teal-d);
  padding:8px 6px;border-radius:9px;cursor:pointer;transition:.16s}
.btn:hover{background:#eef4f2;border-color:#c9dcd8}
.btn:active{transform:translateY(1px)}

/* 房间列表 */
.rms{display:flex;flex-direction:column;gap:2px;margin-top:2px}
.rm{display:flex;align-items:center;gap:9px;padding:5px 9px;border-radius:9px;cursor:pointer;transition:.15s;border:1px solid transparent}
.rm:hover{background:#f2f4f0}
.rm.sel{background:#eaf1ef;border-color:#cfe0dc}
.rm .sw{width:12px;height:12px;border-radius:3px;flex:none}
.rm b{font-size:12.5px;font-weight:700}
.rm span{margin-left:auto;font-size:11.5px;color:var(--sub);font-weight:600}

/* 右上指北针 */
.tr{top:16px;right:16px;width:62px;height:62px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.compass{width:46px;height:46px;position:relative}
.compass .n{position:absolute;top:-2px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:800;color:var(--teal-d)}
.compass .ar{position:absolute;left:50%;top:12px;transform:translateX(-50%);width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:22px solid var(--accent)}
.compass .ar.gray{border-bottom-color:#b9c0bb;top:auto;bottom:8px;transform:translateX(-50%) rotate(180deg)}

/* 信息卡 */
.info{left:16px;bottom:16px;max-width:286px;width:calc(100% - 32px)}
.info h2{font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px}
.info h2 .pin{width:10px;height:10px;border-radius:50%}
.info .area{font-size:26px;font-weight:800;color:var(--teal-d);margin:7px 0 1px;letter-spacing:.5px}
.info .area small{font-size:12px;color:var(--sub);font-weight:600;margin-left:5px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;margin-top:10px;font-size:12px}
.kv dt{color:var(--sub)}
.kv dd{font-weight:600;text-align:right}
.info p{font-size:11.5px;color:var(--sub);line-height:1.6;margin-top:9px;border-top:1px dashed var(--line);padding-top:8px}
.info .dooracts{display:flex;gap:8px;margin-top:10px}
.info .dooracts .btn{flex:1}

/* 底部提示 */
.hint{bottom:16px;left:50%;transform:translateX(-50%);padding:8px 16px;border-radius:20px;font-size:11.5px;color:var(--sub);
  background:rgba(255,255,255,.86);border:1px solid var(--line);box-shadow:0 4px 16px rgba(38,51,47,.08);white-space:nowrap}
.hint b{color:var(--teal-d)}
.toast{position:fixed;left:50%;top:64px;transform:translateX(-50%) translateY(-8px);z-index:40;background:rgba(38,51,47,.92);color:#fff;
  font-size:12.5px;padding:9px 16px;border-radius:9px;opacity:0;transition:.25s;pointer-events:none;max-width:80%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.collapse{display:block}
.more-toggle{display:none;width:100%;margin-top:10px}
@media (max-width:760px){
  .tl{top:10px;left:10px;right:10px;max-width:none;padding-bottom:2px}
  .more-toggle{display:block}
  .collapse{display:none}
  .collapse.open{display:block}
  .tr{top:262px;bottom:auto;right:12px;width:50px;height:50px}
  .compass{width:40px;height:40px}
  .info{left:10px;right:10px;bottom:10px;max-width:none;width:auto;max-height:40vh;overflow:auto}
  .info .area{font-size:21px}
  .info p{display:none}
  .hint{display:none}
  .toggles{grid-template-columns:1fr 1fr}
  .seg button{padding:12px 4px;font-size:13.5px;min-height:44px}
  .btn{padding:12px 6px;font-size:13px;min-height:44px}
  .more-toggle{min-height:44px}
  .tg{padding:11px 9px;font-size:12.5px;min-height:42px}
  .rm{padding:11px 9px;min-height:42px}
  .brand h1{font-size:15px}
}
</style>
</head>
<body>
<div id="loader">
  <svg class="lr-logo" viewBox="0 0 32 32"><path d="M4 15 16 5l12 10v12H20v-7h-8v7H4z" fill="none" stroke="#2f5d5b" stroke-width="2" stroke-linejoin="round"/></svg>
  <div class="lr-title">户型 3D 复原</div>
  <div class="lr-sub" id="lrText">正在加载三维引擎…</div>
  <div class="lr-bar"><i></i></div>
</div>

<div id="stage"></div>

<div class="hud tl panel">
  <div class="pad">
    <div class="brand">
      <svg viewBox="0 0 32 32"><path d="M4 15 16 5l12 10v12H20v-7h-8v7H4z" fill="none" stroke="#2f5d5b" stroke-width="2" stroke-linejoin="round"/><path d="M13 27v-6h6v6" fill="none" stroke="#d08b4e" stroke-width="2" stroke-linejoin="round"/></svg>
      <h1>大床房公寓 · 1:1 三维户型<small>净尺寸 9197 × 4845 mm · 约 33.6 ㎡</small></h1>
    </div>
    <div class="meta">
      <span class="chip">1 室</span><span class="chip">1 卫</span><span class="chip">干湿分离</span><span class="chip">东向落地窗</span>
    </div>

    <div class="divider"></div>
    <div class="ctl-label">观察视角</div>
    <div class="seg" id="viewSeg">
      <button data-v="3d" class="on">立体</button>
      <button data-v="top">俯视</button>
      <button data-v="eye">人视</button>
    </div>
    <button class="btn more-toggle" id="panelToggle" type="button" aria-expanded="false">图层 · 门窗 · 房间</button>
    <div class="collapse" id="panelCollapse">
    <div class="ctl-label">显示图层</div>
    <div class="toggles">
      <div class="tg on" data-layer="dim"><span class="dot"></span>尺寸标注</div>
      <div class="tg on" data-layer="label"><span class="dot"></span>房间标签</div>
      <div class="tg" data-layer="ceil"><span class="dot"></span>顶面</div>
      <div class="tg on" data-layer="furn"><span class="dot"></span>布置家具</div>
      <div class="tg wide" data-layer="ghost"><span class="dot"></span>墙体半透明（俯视剖墙）</div>
    </div>

    <div class="ctl-label">门窗</div>
    <div class="btnrow">
      <button class="btn" id="openAll">全部打开</button>
      <button class="btn" id="closeAll">全部关闭</button>
      <button class="btn" id="resetView">重置视角</button>
    </div>

    <div>
      <div class="ctl-label">房间（点击定位）</div>
      <div class="rms" id="rmList"></div>
    </div>
    </div><!-- /collapse -->
  </div>
</div>

<div class="hud tr panel">
  <div class="compass"><span class="n">N</span><span class="ar"></span><span class="ar gray"></span></div>
</div>

<div class="hud info panel">
  <div class="pad" id="infoBody"></div>
</div>

<div class="hud hint">左键 <b>旋转</b> · 右键 <b>平移</b> · 滚轮 <b>缩放</b> · 点击 <b>房间 / 门 / 窗</b> 互动</div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================================
   三维户型 1:1 复原 —— 尺寸严格依据户型图标注（单位 mm，建模 ×0.001 = m）
   坐标：X 向东(图右)，Z 向南(图下)，Y 向上；原点 = 西北角突出块北外缘
   ========================================================================= */
(function(){
"use strict";
var M = 0.001;                       // mm -> m
var H_ROOM = 2800;                   // 层高（图未标注，按住宅常规 2.8m）
var T_OUT = 255, T_IN = 140;         // 外墙厚 / 内墙厚（按图面墙厚比例）

/* ---------- 墙体（实体分段，已扣除门洞/窗洞）[xMin,xMax,zMin,zMax] mm ---------- */
var WALLS = [
  // 西北角向北突出的管井/玄关龛（北墙 + 东西墙，南侧敞开）
  [1712,3697, 0,255],                // 龛北墙
  [1712,1969, 255,645],              // 龛西墙
  [3560,3697, 255,645],              // 龛东墙
  // 北外墙（西段玄关 / 东段大床房，东端退台 521）
  [227,1969, 645,900],               // 西段北墙（西端角部并入西墙，开亮子）
  [3560,8469, 405,645],              // 东段北墙（大床房）
  [8469,9197, 645,900],              // 东端退台墙垛
  // 西外墙（亮子洞 700~880 / 入户门洞 900~2000）
  [0,227, 645,700],                  // 亮子北垛
  [0,227, 880,900],                  // 亮子南垛
  [0,227, 2000,4845],
  // 东外墙（落地窗洞 900~4622，窗洞长 3722）
  [8969,9197, 630,900],              // 窗上墙/梁
  [8969,9197, 4622,4845],            // 窗下墙/反坎
  // 南外墙（整段）
  [0,9197, 4590,4845],
  // 内横墙：卫生间北墙（西段实墙）
  [0,1636, 1980,2130],
  // 内横墙东端门垛（干区入口 1636~3560 为大开口）
  [3560,3697, 1980,2130],
  // 卫生间 / 干区 分隔墙（卫生间推拉门洞 2130~2930）
  [1500,1636, 2930,4590],
  // 干区 / 大床房 分隔墙（北段 645~1980 敞开；推拉门洞 2130~4350）
  [3560,3697, 4350,4590]
];

/* ---------- 房间净区（地面分色 / 拾取 / 信息）[xMin,xMax,zMin,zMax] ---------- */
var ROOMS = [
  {id:'bed', name:'大床房', area:25.5, color:0xe9dcc3, cx:6300, cz:2750,
    box:[3697,8969, 645,4590],
    dim:'大开间约 5.27m × 3.96m', note:'核心起居空间，东向整面落地推拉门采光；进门玄关、北侧凹龛与房间连通，实际可用面积含玄关。'},
  {id:'entry', name:'玄关 / 过道', area:null, color:0xe6ddc9, cx:1780, cz:1450,
    box:[227,3560, 900,1980],
    dim:'约 3.33m × 1.08m', note:'入户过渡空间，北侧凹龛可作管井/鞋柜；东侧与大床房大开间连通，南侧经干区入口进入洗漱区。'},
  {id:'dry', name:'干区（洗漱）', area:4.83, color:0xdedfd8, cx:2560, cz:3360,
    box:[1636,3560, 2130,4590],
    dim:'净宽 1.93m × 深 2.46m', note:'干湿分离的外置洗手台区域，北侧为推拉门入口，东侧推拉门连通大床房。'},
  {id:'bath', name:'卫生间', area:3.2, color:0xd3dde0, cx:860, cz:3360,
    box:[227,1500, 2130,4590],
    dim:'净宽 1.28m × 深 2.50m', note:'暗卫（无外窗），门开向干区。原图未明示门扇，按干湿分离常规设吊轨推拉门。'}
];

/* ---------- 门 / 窗 ----------
   type: swing 平开门 | slide 推拉门/窗；wall: 'x'(沿X走向,门扇沿X) / 'z'(沿Z走向)
   平开门 hinge 为门轴端坐标；推拉门给出轨道范围与扇宽 */
var OPEN = { M1:false, M2:false, M3:false, D1:false, C1:false };
var ELEMENTS = [
  {id:'M1', kind:'door', type:'swing', name:'入户平开门', wall:'z',
   // 西墙门洞 z 900~2000（宽1100），门轴在北端 z=900，向内(东)开
   jamb:[0,227], z0:900, z1:2000, hinge:'start', openSide:1, leafT:42, h:2100,
   spec:'门洞宽 1100mm · 门扇高 2100mm', note:'户型图唯一入户门，门轴居北，向室内东侧开启，门侧带固定亮子。'},
  {id:'D0', kind:'window', type:'fix', name:'门侧亮子', wall:'z',

  {id:'D1', kind:'door', type:'slide', name:'干区入口推拉门', wall:'x',
   // 横墙缺口 x 1636~3560（宽约1924），双扇沿X
   jamb:[1990,2130], x0:1636, x1:3560, leaves:2, leafT:40, h:2100, slideTo:'end',
   spec:'洞口宽约 1924mm · 双扇吊轨推拉', note:'玄关进入干区（洗漱区）的推拉门，双轨双扇，开启后两扇叠于一侧。'},
  {id:'M3', kind:'door', type:'slide', name:'卫生间推拉门', wall:'z',
   // 卫生间东隔墙门洞 z 2130~2930（宽800），单扇沿Z向南滑，轨道贴干区侧墙面
   jamb:[1636,1674], z0:2130, z1:2930, leaves:1, leafT:38, h:2100, slideTo:'end',
   spec:'门洞宽 800mm · 单扇吊轨推拉', note:'卫生间通向干区的推拉门，开启时门扇滑入干区一侧（原图未画门扇，按常规补设）。'},
  {id:'M2', kind:'door', type:'slide', name:'干区·大床房推拉门', wall:'z',
   // 干区东隔墙洞 z 2130~4350（长2220），双扇沿Z
   jamb:[3560,3697], x:3600, z0:2130, z1:4350, leaves:2, leafT:40, h:2100, slideTo:'start',
   spec:'洞口宽 2220mm · 双轨双扇推拉', note:'分隔干区与大床房的长推拉门，双扇可叠合开启约一半净宽。'},
  {id:'C1', kind:'window', type:'slide', name:'东向落地推拉门', wall:'z',
   // 东墙窗洞 z 900~4622（长3722），落地玻璃双扇沿Z
   jamb:[8990,9150], x:9060, z0:900, z1:4622, leaves:2, leafT:50, h:2400, sill:20, slideTo:'end', floor:true,
   spec:'窗洞长 3722mm · 落地双扇玻璃推拉门', note:'主要采光面，近落地设计，双扇大面积玻璃推拉门，临东向外墙。'}
];

/* ---------- 尺寸标注（贴近地面、外墙外侧）---------- */
var DIMS = [
  // 南侧（下边）
  {axis:'x', at:4845+420, from:0,to:9197, txt:'9197', major:true},
  {axis:'x', at:4845+180, from:0,to:1280, txt:'1280'},
  {axis:'x', at:4845+180, from:1280,to:3211, txt:'1931'},
  {axis:'x', at:4845+180, from:3211,to:8477, txt:'5266'},
  // 北侧（上边）
  {axis:'x', at:-420, from:0,to:9197, txt:'9197', major:true},
  {axis:'x', at:-180, from:227,to:1712, txt:'1498'},
  {axis:'x', at:-180, from:1969,to:3560, txt:'1593'},
  {axis:'x', at:-180, from:3697,to:8197, txt:'4505'},
  {axis:'x', at:-180, from:8197,to:8710, txt:'521'},
  // 西侧（左边）
  {axis:'z', at:-420, from:0,to:4845, txt:'4845', major:true},
  {axis:'z', at:-180, from:0,to:403, txt:'403'},
  {axis:'z', at:-180, from:900,to:2000, txt:'1100'},
  {axis:'z', at:-180, from:2130,to:4590, txt:'2502'},
  // 东侧（右边）
  {axis:'z', at:9197+420, from:405,to:4845, txt:'4442', major:true},
  {axis:'z', at:9197-360, from:900,to:4622, txt:'3722'}
];

/* ===================== 引擎加载（jsDelivr → cdnjs 备用） ===================== */
function addScript(src){return new Promise(function(res,rej){var s=document.createElement('script');s.src=src;s.onload=res;s.onerror=function(){rej(new Error(src));};document.head.appendChild(s);});}
addScript('https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js')
 .catch(function(){return addScript('https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js');})
 .then(boot).catch(fatal);

function fatal(e){document.getElementById('lrText').textContent='三维引擎加载失败，请联网后刷新';throw e;}

/* ===================== 全局 ===================== */
var CX=4598.5, CZ=2422.5, G={}, doors=[];
function px(v){return (v-CX)*M;}
function pz(v){return (v-CZ)*M;}
function ease(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}

function boot(){

      msh.position.set(px(x),y0*M+h*M/2,pz(z));msh.castShadow=true;msh.receiveShadow=true;grpFurn.add(msh);return msh;}
    function fs(r,x,z,y,m,seg){var g=new T.SphereGeometry(r*M,seg||20,Math.max(12,Math.floor((seg||20)*.7)));var msh=new T.Mesh(g,m);
      msh.position.set(px(x),y*M,pz(z));msh.castShadow=true;msh.receiveShadow=true;grpFurn.add(msh);return msh;}
    function fgrp(x,z,rot){var g=new T.Group();g.position.set(px(x),0,pz(z));if(rot)g.rotation.y=rot;grpFurn.add(g);return g;}
    var ed=function(m,c){addEdges(m,c==null?0x9a8a6a:c,.5);};

    /* ===== King 软包大床（床头靠南墙）2180(x) × 2100(z)，床头高 980 ===== */
    fb2(5250,7430,2490,4590,0,70,F.base);                          // 胡桃木底座

    fb2(5320,7360,2560,4480,380,600,F.mattress);                   // 床垫

    fb2(5390,6270,4140,4470,600,800,F.pillow);                     // 左枕
    fb2(6410,7290,4140,4470,600,800,F.pillow);                     // 右枕
    ed(fb2(5250,7430,4470,4590,0,980,F.upholD),0xa8916a);          // 床头板底板（贴南墙）
    (function(){var cols=8,rows=3,gap=18,bw=(2180-(cols+1)*gap)/cols,bh=(980-(rows+1)*gap)/rows;
      for(var c=0;c<cols;c++)for(var r=0;r<rows;r++){

        fb2(x1,x1+bw,4416,4472,y1,y1+bh,F.uphol);                  // 8×3 方格软包
      }})();

    /* ===== 床头柜 ×2（500×400）+ 蘑菇台灯 ===== */
    [[4750,5250,5000],[7430,7930,7680]].forEach(function(t){
      var x1=t[0],x2=t[1],cx=t[2];
      ed(fb2(x1,x2,4190,4590,0,480,F.wood),0x8a6a3c);
      fb2(x1+8,x2-8,4178,4192,232,240,F.woodD);                    // 抽屉横缝
      fc(34,40,24,cx,4390,480,MAT.metal,18);                       // 灯座
      fc(11,11,178,cx,4390,504,MAT.metal,12);                      // 灯杆
      var sh=fs(88,cx,4390,712,F.shade,22);sh.scale.y=.62;         // 灯罩
    });

    /* ===== 通顶衣柜（北墙西段 1700×600，高 2700） ===== */
    ed(fb2(3900,5600,660,1260,0,2700,F.woodL),0xa07d4e);
    [[3900,4466],[4466,5033],[5033,5600]].forEach(function(s){
      fb2(s[0]+3,s[1]-3,1256,1286,20,2680,F.wood);                 // 三扇柜门
      fc(14,14,330,s[1]-34,1290,1150,MAT.metal,12);                // 竖向拉手
    });
    fb2(3900,5600,1284,1302,2680,2702,F.woodD);                    // 收口线

    /* ===== 电视柜 1700×400 + 壁挂电视（北墙中段，正对床尾） ===== */
    ed(fb2(5800,7500,660,1060,0,460,F.wood),0x8a6a3c);
    fb2(5800,7500,1056,1070,224,232,F.woodD);
    fb2(6120,7180,630,690,1030,1630,MAT.metal);                   // 电视边框
    fb2(6160,7140,688,702,1070,1590,F.dark);                      // 屏幕

    /* ===== 梳妆台 850×450 + 镜 + 圆凳（北墙东段，靠东窗采光） ===== */
    fb2(7600,8450,660,1110,720,760,F.woodL);                      // 台面
    fb2(7600,8010,700,1110,0,720,F.wood);                         // 左侧抽屉柜
    fb2(8380,8450,700,1110,0,720,F.woodD);                        // 右腿板

    fc(160,120,300,8640,1200,0,F.pot,26);
    fc(150,150,22,8640,1200,300,F.dark,24);
    fc(16,24,540,8640,1200,300,F.woodD,12);
    fs(225,8640,1200,1080,F.leaf2,24);
    fs(155,8485,1200,1000,F.leaf1,20);
    fs(150,8790,1280,960,F.leaf1,20);
    fs(140,8600,1370,1160,F.leaf2,20);
    fs(125,8745,1080,1240,F.leaf1,18);

    /* ===== 休闲椅（东窗中段，面朝西南） ===== */
    (function(){var g=fgrp(8380,2150,.4);
      lbox(g,-290,-250,-280,-240,0,380,F.woodD);lbox(g,250,290,-280,-240,0,380,F.woodD);
      lbox(g,-290,-250,240,280,0,380,F.woodD);lbox(g,250,290,240,280,0,380,F.woodD);
      lbox(g,-310,310,-300,300,380,520,F.uphol);                   // 座垫
      lbox(g,250,332,-300,300,520,1080,F.upholD);                  // 靠背
      lbox(g,-310,280,-332,-272,520,740,F.uphol);                  // 左扶手
      lbox(g,-310,280,272,332,520,740,F.uphol);                    // 右扶手
      lbox(g,232,272,-260,260,560,980,F.pillow);                   // 靠枕
    })();

    /* ===== 边几（休闲椅西侧） ===== */
    fc(150,150,500,7720,2130,0,F.wood,28);
    fc(166,166,26,7720,2130,500,F.woodL,28);

    /* ===== 床尾凳 1180×330 ===== */
    [[5770,5830,2155,2215],[6850,6910,2155,2215],[5770,5830,2385,2445],[6850,6910,2385,2445]].forEach(function(t){
      fb2(t[0],t[1],t[2],t[3],0,140,F.woodD);});
    ed(fb2(5750,6930,2135,2465,140,470,F.uphol),0xb6a17e);
    fb2(6334,6346,2135,2465,150,460,F.upholD);
    /* 干区：洗手台 + 镜柜（南墙） */
    fb2(1750,3450,4240,4540,0,820,F.cab);
    fb2(1720,3480,4220,4560,820,866,F.stone);
    fb2(2200,2760,4280,4520,866,905,F.cer);
    fb2(1900,3300,4540,4562,1200,2120,F.mirror);
    /* 卫生间：北端淋浴 */
    fb2(300,1450,2180,2210,0,30,F.stone);
    fb2(300,1450,2930,2954,0,2050,MAT.glass,null,false);
    fb2(1330,1370,2230,2270,900,2050,MAT.metal);
    fb2(1280,1370,2200,2240,2050,2090,MAT.metal);
    /* 马桶（靠西墙） */
    fb2(280,540,3260,3500,520,1150,F.cer);
    fb2(320,780,3500,4080,380,680,F.cer);
    fb2(360,740,3560,4020,640,700,F.dark);
    /* 洗衣机（南端） */
    fb2(360,1060,4080,4500,0,900,F.cab);
    fb2(400,1020,4120,4460,900,924,F.stone);
  })();

  /* ===================== 信息卡 / 房间列表 ===================== */
  var ROOM_COLOR={bed:'#d8b98a',entry:'#cbb896',dry:'#bfc3b6',bath:'#a9bcc4'};
  var G_SEL={type:'home'};
  function elById(id){return ELEMENTS.filter(function(e){return e.id===id;})[0];}
  function doorById(id){return doors.filter(function(d){return d.id===id;})[0];}
  function kv(k,v){return '<dt>'+k+'</dt><dd>'+v+'</dd>';}
  function renderInfo(){
    var b=$('infoBody'),h='';
    if(G_SEL.type==='room'){
      var r=ROOMS.filter(function(x){return x.id===G_SEL.id;})[0];
      h='<h2><span class="pin" style="background:'+ROOM_COLOR[r.id]+'"></span>'+r.name+'</h2>'
        +'<div class="area">'+(r.area?r.area.toFixed(2)+'<small>㎡</small>':'<span style="font-size:15px;color:#6a7772">并入大床房 25.5㎡</span>')+'</div>'
        +'<dl class="kv">'+kv('净尺寸',r.dim)+kv('地面',r.id==='bath'?'防滑瓷砖':r.id==='dry'?'防滑砖':'复合木地板')+'</dl>'
        +'<p>'+r.note+'</p>';
    }else if(G_SEL.type==='door'){
      var e=elById(G_SEL.id),d=doorById(G_SEL.id),open=d?d.open===1:false,fix=e.type==='fix';
      h='<h2><span class="pin" style="background:'+(e.kind==='window'?'#7fa9b4':'#b78a58')+'"></span>'+e.name+'</h2>'
        +'<dl class="kv">'+kv('规格',e.spec)+kv('状态',fix?'固定不可开启':(open?'已开启':'已关闭'))+'</dl>'
        +(fix?'':'<div class="dooracts"><button class="btn" id="doorToggle">'+(open?'关闭此门 / 窗':'打开此门 / 窗')+'</button></div>')
        +'<p>'+e.note+'</p>';
    }else{
      h='<h2><span class="pin" style="background:#2f5d5b"></span>户型概览</h2>'
        +'<div class="area">约 33.5<small>㎡（室内净面积）</small></div>'
        +'<dl class="kv">'
        +kv('外墙尺寸','9197 × 4845 mm')+kv('层高','2.8 m（常规取值）')
        +kv('采光','东向整面落地窗')+kv('格局','1室 · 1卫 · 干湿分离')+'</dl>'
        +'<p>按户型图 1:1 复原，单位毫米；可旋转 / 缩放 / 平移，点击房间看信息、点门窗开合。大床房已按确认方案布置 King 软包大床（床头靠南墙）与全套家具；卫生间门为常规补设，层高 2.8m 为常规取值。</p>';
    }
    b.innerHTML=h;
    var dt=$('doorToggle');if(dt)dt.onclick=function(){toggleDoor(G_SEL.id);};
    document.querySelectorAll('#rmList .rm').forEach(function(el){el.classList.toggle('sel',G_SEL.type==='room'&&el.dataset.id===G_SEL.id);});
  }
  function buildRoomList(){
    var order=['bed','entry','dry','bath'],html='';
    order.forEach(function(id){
      var r=ROOMS.filter(function(x){return x.id===id;})[0];
      html+='<div class="rm" data-id="'+id+'"><span class="sw" style="background:'+ROOM_COLOR[id]+'"></span><b>'+r.name+'</b><span>'+(r.area?r.area.toFixed(2)+'㎡':'含在内')+'</span></div>';
    });
    $('rmList').innerHTML=html;
    document.querySelectorAll('#rmList .rm').forEach(function(el){el.onclick=function(){focusRoom(el.dataset.id);};});
  }
  function selectRoom(id){G_SEL={type:'room',id:id};clearRoomHL();G.pickMat[id].opacity=.22;renderInfo();}
  function clearRoomHL(){for(var k in G.pickMat)G.pickMat[k].opacity=0;}
  function toggleDoor(id){
    var d=doorById(id);if(!d)return;d.open=d.open?0:1;renderInfo();
    toast((d.open?'已打开：':'已关闭：')+elById(id).name);
  }
  var toastTimer;
  function toast(msg){var t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('show');},1700);}

  /* ===================== 相机与自写轨道控制 ===================== */
  var V3=T.Vector3;
  function fitRadius(){var a=innerWidth/innerHeight,k=Math.tan(21*Math.PI/180);
    return Math.max(5.05/(k*Math.min(a,1.7)),3.1/k)*1.30;}
  var DEF3={tgt:new V3(1.5,1.0,.8),r:fitRadius(),theta:2.62,phi:.72};
  var EYE={tgt:new V3(3.4,1.28,1.0),r:7.5,theta:1.3,phi:1.53};
  var last3={tgt:DEF3.tgt.clone(),r:DEF3.r,theta:DEF3.theta,phi:DEF3.phi};
  var goal={mode:'3d',tgt:DEF3.tgt.clone(),r:DEF3.r,theta:DEF3.theta,phi:DEF3.phi,view:Math.max(3.1,5.8/(innerWidth/innerHeight))};
  var cur={tgt:goal.tgt.clone(),r:goal.r,theta:goal.theta,phi:goal.phi,view:goal.view};
  G.goal=goal;
  function initOrtho(){camO.up.set(0,0,-1);camO.position.set(0,22,0);}
  function updateCamera(k){
    cur.tgt.lerp(goal.tgt,k);cur.r+=(goal.r-cur.r)*k;cur.theta+=(goal.theta-cur.theta)*k;
    cur.phi+=(goal.phi-cur.phi)*k;cur.view+=(goal.view-cur.view)*k;
    cur.tgt.x=Math.max(-5.2,Math.min(5.2,cur.tgt.x));cur.tgt.z=Math.max(-3.4,Math.min(3.4,cur.tgt.z));
    if(goal.mode==='top'){
      var a=innerWidth/innerHeight,v=cur.view;
      camO.left=-v*a;camO.right=v*a;camO.top=v;camO.bottom=-v;camO.updateProjectionMatrix();
      camO.position.set(cur.tgt.x,22,cur.tgt.z);camO.lookAt(cur.tgt.x,0,cur.tgt.z);G.camera=camO;
    }else{
      var phi=cur.phi,th=cur.theta,sp=Math.sin(phi),cp=Math.cos(phi);
      camP.position.set(cur.tgt.x+cur.r*sp*Math.sin(th),cur.tgt.y+cur.r*cp,cur.tgt.z+cur.r*sp*Math.cos(th));
      camP.lookAt(cur.tgt);G.camera=camP;
    }
  }
  function save3(){if(goal.mode==='3d'){last3={tgt:cur.tgt.clone(),r:cur.r,theta:cur.theta,phi:cur.phi};}}
  function applyWalls(){
    var tg=document.querySelector('.tg[data-layer="ghost"]');
    var gh=tg&&tg.classList.contains('on');
    var on=gh||goal.mode==='top';
    var op=goal.mode==='top'?.075:.2;
    [MAT.wall,MAT.lintel].forEach(function(m){m.transparent=on;m.opacity=on?op:1;m.depthWrite=!on;m.needsUpdate=true;});
  }
  function setView(v){
    goal.mode=v;
    document.querySelectorAll('#viewSeg button').forEach(function(b){b.classList.toggle('on',b.dataset.v===v);});
    var a=innerWidth/innerHeight;
    if(v==='top'){goal.tgt.set(0,0,0);goal.view=Math.max(3.1,5.8/a);toast('俯视平面图：墙体已剖切半透明，滚轮缩放 / 右键平移');}
    if(v==='3d'){goal.tgt.copy(last3.tgt);goal.r=last3.r;goal.theta=last3.theta;goal.phi=last3.phi;}
    if(v==='eye'){save3();goal.tgt.copy(EYE.tgt);goal.r=EYE.r;goal.theta=EYE.theta;goal.phi=EYE.phi;toast('人视高度：由入户门望向落地窗前');}
    applyWalls();
  }
  function focusRoom(id){
    var r=ROOMS.filter(function(x){return x.id===id;})[0];if(!r)return;
    setView('3d');save3();
    goal.tgt.set(px(r.cx),.5,pz(r.cz));goal.r=id==='bed'?10.8:5.8;goal.phi=.98;goal.theta=.6;
    selectRoom(id);
  }
  function resetView(){
    clearRoomHL();G_SEL={type:'home'};renderInfo();
    goal.tgt.copy(DEF3.tgt);goal.r=fitRadius();goal.theta=DEF3.theta;goal.phi=DEF3.phi;
    goal.view=Math.max(3.1,5.8/(innerWidth/innerHeight));setView('3d');
    toast('已重置视角');
  }

  /* ===================== 指针 / 触摸 / 缩放 ===================== */
  var ray=new T.Raycaster(),ndc=new T.Vector2(),pointers={},down=null,moved=0,pinch=null;
  var doorMeshes=[];clickDoors.forEach(function(r){r.traverse(function(o){if(o.isMesh)doorMeshes.push(o);});});
  function ndcFrom(cx,cy){var rc=renderer.domElement.getBoundingClientRect();
    ndc.x=((cx-rc.left)/rc.width)*2-1;ndc.y=-((cy-rc.top)/rc.height)*2+1;}
  function panBy(dx,dy){
    if(goal.mode==='eye')return;
    if(goal.mode==='top'){var sv=cur.view*.0023;goal.tgt.x-=dx*sv;goal.tgt.z+=dy*sv;return;}
    var s=cur.r*.0016,th=cur.theta,st=Math.sin(th),ct=Math.cos(th);
    goal.tgt.x+=(-ct*dx+st*dy)*s;goal.tgt.z+=(st*dx+ct*dy)*s;
  }
  function pickAt(cx,cy){ndcFrom(cx,cy);ray.setFromCamera(ndc,G.camera);
    var hits=ray.intersectObjects(doorMeshes.concat(pickPlanes),false);
    return hits.length?hits[0].object:null;}
  var cv=renderer.domElement;
  cv.addEventListener('contextmenu',function(e){e.preventDefault();});
  cv.addEventListener('pointerdown',function(e){
    cv.setPointerCapture(e.pointerId);pointers[e.pointerId]={x:e.clientX,y:e.clientY};
    var ks=Object.keys(pointers);moved=0;
    if(ks.length===2){var p=pointers[ks[0]],q=pointers[ks[1]];
      pinch={d:Math.hypot(p.x-q.x,p.y-q.y),mx:(p.x+q.x)/2,my:(p.y+q.y)/2};down='pinch';}
    else{down=(e.button===2||e.button===1||goal.mode==='top')?'pan':'rot';}
  });
  cv.addEventListener('pointermove',function(e){
    if(!pointers[e.pointerId]){hover(e);return;}
    var pv=pointers[e.pointerId],dx=e.clientX-pv.x,dy=e.clientY-pv.y;
    pointers[e.pointerId]={x:e.clientX,y:e.clientY};moved+=Math.abs(dx)+Math.abs(dy);
    var ks=Object.keys(pointers);
    if(down==='pinch'&&ks.length===2){
      var p=pointers[ks[0]],q=pointers[ks[1]],d=Math.hypot(p.x-q.x,p.y-q.y),mx=(p.x+q.x)/2,my=(p.y+q.y)/2;
      var f=pinch.d/Math.max(d,1);
      if(goal.mode==='top')goal.view=Math.max(1.8,Math.min(14,goal.view*f));
      else{save3();goal.r=Math.max(3.5,Math.min(fitRadius()*2.4,goal.r*f));}
      panBy(mx-pinch.mx,my-pinch.my);pinch={d:d,mx:mx,my:my};
    }else if(down==='pan'){panBy(dx,dy);}
    else if(down==='rot'){goal.theta-=dx*.0056;
      var lo=goal.mode==='eye'?1.12:.14,hi=goal.mode==='eye'?1.55:1.47;
      goal.phi=Math.max(lo,Math.min(hi,goal.phi-dy*.0056));}
  });
  function endPointer(e){
    var was=down;delete pointers[e.pointerId];
    if(Object.keys(pointers).length<2)pinch=null;
    if(Object.keys(pointers).length===0){if(was!=='pinch'&&moved<7)handleClick(e.clientX,e.clientY);down=null;}
  }
  cv.addEventListener('pointerup',endPointer);cv.addEventListener('pointercancel',endPointer);
  cv.addEventListener('wheel',function(e){e.preventDefault();var f=1+Math.sign(e.deltaY)*.12;
    if(goal.mode==='top')goal.view=Math.max(1.8,Math.min(14,goal.view*f));
    else{save3();goal.r=Math.max(3.5,Math.min(fitRadius()*2.4,goal.r*f));}},{passive:false});
  function hover(e){if(e.pointerType==='touch')return;var o=pickAt(e.clientX,e.clientY);
    cv.style.cursor=o?'pointer':'grab';
    var show=o&&o.userData.roomId?o.userData.roomId:null;
    if(G_SEL.type!=='room')for(var k in G.pickMat)G.pickMat[k].opacity=(k===show?.1:0);
  }
  function handleClick(cx,cy){
    var o=pickAt(cx,cy);
    if(o&&o.userData.elId){var id=o.userData.elId,el=elById(id);G_SEL={type:'door',id:id};renderInfo();
      if(el.type!=='fix')toggleDoor(id);else toast('固定亮子（门联窗），不可开启');
    }else if(o&&o.userData.roomId){selectRoom(o.userData.roomId);}
  }

  /* ===================== UI 绑定 ===================== */
  document.querySelectorAll('#viewSeg button').forEach(function(b){b.onclick=function(){setView(b.dataset.v);};});
  document.querySelectorAll('.tg[data-layer]').forEach(function(t){
    t.onclick=function(){
      t.classList.toggle('on');var on=t.classList.contains('on'),L=t.dataset.layer;
      if(L==='dim')grpDim.visible=on;
      if(L==='label')grpLabel.visible=on;
      if(L==='ceil')ceil.visible=on;
      if(L==='furn'){grpFurn.visible=on;toast(on?'已显示布置家具':'已隐藏布置家具');}
      if(L==='ghost'){applyWalls();}
    };
  });
  $('openAll').onclick=function(){doors.forEach(function(d){d.open=1;});if(G_SEL.type==='door')renderInfo();toast('门窗已全部打开');};
  $('closeAll').onclick=function(){doors.forEach(function(d){d.open=0;});if(G_SEL.type==='door')renderInfo();toast('门窗已全部关闭');};
  $('resetView').onclick=resetView;
  $('panelToggle').onclick=function(){var c=$('panelCollapse'),o=c.classList.toggle('open');
    this.setAttribute('aria-expanded',o);this.textContent=o?'收起控制 ▴':'图层 · 门窗 · 房间 ▾';};
  initOrtho();buildRoomList();renderInfo();setView(goal.mode);

  /* ===================== 渲染循环 ===================== */
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,first=true;
  function tick(){
    requestAnimationFrame(tick);if(G.hidden)return;
    var k=reduce?1:.16;
    doors.forEach(function(d){
      if(typeof d.cur!=='number')d.cur=0;
      d.cur+=(d.open-d.cur)*(reduce?1:.18);if(Math.abs(d.open-d.cur)<.002)d.cur=d.open;
      var e=d.cur;if(!reduce)e=e<.5?2*e*e:1-Math.pow(-2*e+2,2)/2;
      if(d.kind==='swing'){d.pivot.rotation.y=e*d.side*Math.PI/2;}
      else{d.leafs.forEach(function(L){var c=L.closeC+(L.openC-L.closeC)*e;
        if(L.alongZ)L.g.position.z=pz(c);else L.g.position.x=px(c);});}
    });
    updateCamera(k);renderer.render(scene,G.camera);
    if(first){first=false;window.__sceneReady=true;setTimeout(function(){$('loader').classList.add('hide');},350);}
  }
  document.addEventListener('visibilitychange',function(){G.hidden=document.hidden;});
  addEventListener('resize',function(){renderer.setSize(innerWidth,innerHeight);
    camP.aspect=innerWidth/innerHeight;camP.updateProjectionMatrix();});
  updateCamera(1);renderer.render(scene,G.camera);tick();
}

})();
</script>
</body>
</html>
